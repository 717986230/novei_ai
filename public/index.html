<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 小说写作系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 520px;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 { font-size: 24px; margin-bottom: 8px; }
    .header p { opacity: 0.9; font-size: 14px; }
    .content { padding: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
    }
    .form-group input:focus { outline: none; border-color: #667eea; }
    .hint { margin-top: 6px; font-size: 12px; color: #6b7280; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }
    .result.success { display: block; background: #d1fae5; border: 1px solid #34d399; color: #065f46; }
    .result.error { display: block; background: #fee2e2; border: 1px solid #f87171; color: #991b1b; }
    .result-title { font-weight: 700; margin-bottom: 8px; }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>AI 小说写作系统</h1>
      <p>本地可用版配置面板</p>
    </div>

    <div class="content">
      <div class="form-group">
        <label>API 地址</label>
        <input type="text" id="apiUrl" placeholder="https://integrate.api.nvidia.com/v1/chat/completions">
      </div>

      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="输入 API Key">
        <div class="hint">如已保存过 Key，可留空并继续使用当前配置。</div>
      </div>

      <div class="form-group">
        <label>模型名称</label>
        <input type="text" id="model" placeholder="minimaxai/minimax-m2.5">
      </div>

      <div class="form-group">
        <label>代理地址（可选）</label>
        <input type="text" id="proxyUrl" placeholder="http://127.0.0.1:7890">
        <div class="hint">默认不走系统代理，只有这里填写时才会使用代理。</div>
      </div>

      <button class="btn btn-primary" id="testBtn" onclick="testConnection()">测试连接</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveConfig()">保存配置</button>
      <button class="btn btn-secondary" onclick="openManager()">打开管理面板</button>

      <div class="result" id="result"></div>
    </div>
  </div>

  <script>
    let hasSavedApiKey = false;

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();

        if (config.ai) {
          hasSavedApiKey = !!config.ai.hasApiKey;
          document.getElementById('apiUrl').value = config.ai.apiUrl || '';
          document.getElementById('model').value = config.ai.model || '';
          document.getElementById('proxyUrl').value = config.ai.proxyUrl || '';
        }
      } catch (error) {
        console.error('加载配置失败:', error);
      }
    }

    async function testConnection() {
      const apiUrl = document.getElementById('apiUrl').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const model = document.getElementById('model').value.trim();
      const proxyUrl = document.getElementById('proxyUrl').value.trim();

      if (!apiUrl || (!apiKey && !hasSavedApiKey)) {
        showResult(false, '请填写 API 地址，且提供 API Key 或使用已保存的 Key。');
        return;
      }

      const btn = document.getElementById('testBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span>连接中...';

      try {
        const res = await fetch('/api/test-connection', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiUrl, apiKey, model, proxyUrl })
        });
        const data = await res.json();
        showResult(data.success, data.success ? `连接成功：${data.message}` : `连接失败：${data.error}`);
      } catch (error) {
        showResult(false, `连接失败：${error.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = '测试连接';
      }
    }

    async function saveConfig() {
      const apiUrl = document.getElementById('apiUrl').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const model = document.getElementById('model').value.trim();
      const proxyUrl = document.getElementById('proxyUrl').value.trim();

      if (!apiUrl || (!apiKey && !hasSavedApiKey)) {
        showResult(false, '请填写 API 地址，且提供 API Key 或使用已保存的 Key。');
        return;
      }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = '保存中...';

      try {
        const res = await fetch('/api/save-config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiUrl, apiKey, model, proxyUrl })
        });
        const data = await res.json();

        if (data.success && apiKey) {
          hasSavedApiKey = true;
        }

        showResult(Boolean(data.success), data.success ? '配置已保存。' : '保存失败。');
      } catch (error) {
        showResult(false, `保存失败：${error.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = '保存配置';
      }
    }

    function openManager() {
      window.location.href = '/manager.html';
    }

    function showResult(success, message) {
      const result = document.getElementById('result');
      result.className = `result ${success ? 'success' : 'error'}`;
      result.innerHTML = `<div class="result-title">${success ? '成功' : '失败'}</div>${message}`;
    }

    loadConfig();
  </script>
</body>
</html>
