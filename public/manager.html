<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小说工作台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(140deg, #f8fafc 0%, #dbeafe 50%, #fef3c7 100%);
      color: #0f172a;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1480px; margin: 0 auto; }
    .header, .panel, .stat-card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
    }
    .header {
      padding: 24px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .header h1 { font-size: 28px; }
    .header p { margin-top: 8px; color: #64748b; font-size: 14px; line-height: 1.6; }
    .header a { color: #0f766e; text-decoration: none; font-weight: 700; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card { padding: 18px; }
    .stat-value { font-size: 30px; font-weight: 800; color: #0f766e; }
    .stat-label { margin-top: 8px; color: #64748b; font-size: 13px; }
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr 520px;
      gap: 20px;
      align-items: start;
    }
    .panel { padding: 22px; margin-bottom: 20px; }
    .panel h2 {
      font-size: 18px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      background: #fff;
    }
    .form-group textarea { min-height: 96px; resize: vertical; }
    .editor textarea { min-height: 460px; }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: #0f766e;
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      padding: 12px 18px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
    .btn-primary { background: linear-gradient(135deg, #0f766e 0%, #0ea5e9 100%); color: #fff; }
    .btn-secondary { background: #ecfeff; color: #0f766e; }
    .btn-danger { background: #fff1f2; color: #be123c; }
    .result-box {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
    }
    .result-box.show { display: block; }
    .result-box.success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .result-box.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .book-list, .chapter-list, .workflow-list { display: grid; gap: 12px; max-height: 700px; overflow-y: auto; }
    .book-item, .chapter-item, .workflow-item {
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }
    .book-item.active, .chapter-item.active, .workflow-item.active {
      border-color: #14b8a6;
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.12);
    }
    .book-item h3, .chapter-item h3, .workflow-item h3 {
      font-size: 15px;
      margin-bottom: 6px;
    }
    .book-meta, .chapter-meta, .workflow-meta {
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
    .book-actions, .chapter-actions, .workflow-actions { display: flex; gap: 8px; margin-top: 12px; }
    .book-actions button, .mini-btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }
    .select-btn { background: #ecfeff; color: #0f766e; }
    .delete-btn, .mini-btn.delete { background: #fff1f2; color: #be123c; }
    .empty { color: #64748b; text-align: center; padding: 24px; }
    .hint { margin-top: 8px; color: #64748b; font-size: 12px; line-height: 1.6; }
    .sticky { position: sticky; top: 20px; }
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .editor-header strong { font-size: 16px; }
    .editor-placeholder {
      color: #64748b;
      line-height: 1.7;
      padding: 32px 12px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      background: #e2e8f0;
      color: #334155;
    }
    .badge.running, .badge.pending { background: #dbeafe; color: #1d4ed8; }
    .badge.succeeded { background: #dcfce7; color: #166534; }
    .badge.failed { background: #fee2e2; color: #991b1b; }
    .progress {
      margin-top: 10px;
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #0f766e 0%, #0ea5e9 100%);
      width: 0;
      transition: width 0.2s ease;
    }
    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.75);
      border-top-color: transparent;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 1280px) {
      .layout { grid-template-columns: 320px 1fr; }
      .editor-column { grid-column: 1 / -1; }
    }
    @media (max-width: 860px) {
      .layout, .stats { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>小说工作台</h1>
        <p>当前项目是原生 Node.js + Express + 静态 HTML。章节生成已改成工作流：点击一次，后端异步执行，页面自动轮询状态，完成后自动刷新并通知。</p>
      </div>
      <a href="/">返回配置页</a>
    </div>

    <div class="stats">
      <div class="stat-card"><div class="stat-value" id="totalChapters">0</div><div class="stat-label">总章节</div></div>
      <div class="stat-card"><div class="stat-value" id="publishedChapters">0</div><div class="stat-label">已发布</div></div>
      <div class="stat-card"><div class="stat-value" id="totalWords">0</div><div class="stat-label">总字数</div></div>
      <div class="stat-card"><div class="stat-value" id="avgWords">0</div><div class="stat-label">平均字数</div></div>
    </div>

    <div class="layout">
      <div>
        <div class="panel">
          <h2>书籍管理</h2>
          <div class="form-group">
            <label for="newBookTitle">书名</label>
            <input id="newBookTitle" type="text" placeholder="可留空，由 AI 自动生成">
          </div>
          <div class="form-group">
            <label for="newBookType">类型</label>
            <input id="newBookType" type="text" placeholder="例如：都市异能、玄幻、悬疑">
          </div>
          <div class="form-group">
            <label for="newBookDesc">简介</label>
            <textarea id="newBookDesc" placeholder="输入主角设定、冲突和卖点"></textarea>
          </div>
          <div class="actions">
            <button class="btn btn-primary" onclick="createBook()">新增书籍</button>
          </div>
          <div class="result-box" id="bookResult"></div>
        </div>

        <div class="panel">
          <h2>书籍列表</h2>
          <div class="book-list" id="bookList">
            <div class="empty">暂无书籍</div>
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <h2>当前书籍</h2>
          <div class="form-group">
            <label for="novelTitle">书名</label>
            <input id="novelTitle" type="text" placeholder="请先从左侧选择一本书">
          </div>
          <div class="form-group">
            <label for="novelType">类型</label>
            <input id="novelType" type="text">
          </div>
          <div class="form-group">
            <label for="novelDesc">简介</label>
            <textarea id="novelDesc"></textarea>
          </div>
          <div class="actions">
            <button class="btn btn-primary" onclick="saveCurrentBook()">保存当前书信息</button>
            <button class="btn btn-danger" onclick="resetCurrentBook()">重置当前书</button>
          </div>
          <div class="result-box" id="currentBookResult"></div>
        </div>

        <div class="panel">
          <h2>生成工作流</h2>
          <div class="actions">
            <button class="btn btn-primary" id="btnWorkflowOne" onclick="startGenerationWorkflow(1, event)">启动下一章工作流</button>
            <button class="btn btn-secondary" id="btnWorkflowTen" onclick="startGenerationWorkflow(10, event)">启动 10 章工作流</button>
            <button class="btn btn-secondary" id="btnRepair" onclick="repairData(event)">修复当前书数据</button>
            <button class="btn btn-danger" id="btnPublish" onclick="publishChapters(event)">发布待发布章节</button>
          </div>
          <div class="hint">工作流启动后页面不会卡住。即使你手动刷新，只要任务已经提交，页面会重新读取状态并继续显示进度。</div>
          <div class="result-box" id="workflowResult"></div>
          <div class="result-box" id="publishResult"></div>
        </div>

        <div class="panel">
          <h2>工作流列表</h2>
          <div class="workflow-list" id="workflowList">
            <div class="empty">当前书暂无工作流</div>
          </div>
        </div>

        <div class="panel">
          <h2>章节列表</h2>
          <div class="hint">点击任意章节即可在右侧查看全文并编辑。</div>
          <div class="chapter-list" id="chapterList">
            <div class="empty">当前书暂无章节</div>
          </div>
        </div>
      </div>

      <div class="editor-column">
        <div class="panel sticky">
          <div class="editor-header">
            <strong id="editorTitle">章节编辑器</strong>
            <span id="editorMeta" class="chapter-meta"></span>
          </div>
          <div id="editorEmpty" class="editor-placeholder">点击章节列表中的任意一章，这里会显示完整正文并允许编辑保存。</div>
          <div id="editorForm" style="display:none;">
            <div class="form-group">
              <label for="editChapterTitle">章节标题</label>
              <input id="editChapterTitle" type="text">
            </div>
            <div class="form-group editor">
              <label for="editChapterContent">章节正文</label>
              <textarea id="editChapterContent"></textarea>
            </div>
            <div class="actions">
              <button class="btn btn-primary" id="btnSaveChapter" onclick="saveChapterEdit(event)">保存修改</button>
              <button class="btn btn-secondary" onclick="reloadSelectedChapter()">重新加载</button>
            </div>
            <div class="result-box" id="editorResult"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentBookKey = '';
    let selectedChapterNumber = null;
    let activeWorkflowId = '';
    let workflowPollTimer = null;
    let workflowListPollTimer = null;
    let lastFinishedWorkflowId = '';

    function getSelectedChapterStorageKey(bookKey) {
      return `novel_ai_selected_chapter_${bookKey || 'default'}`;
    }

    function getActiveWorkflowStorageKey(bookKey) {
      return `novel_ai_active_workflow_${bookKey || 'default'}`;
    }

    function persistSelectedChapter() {
      if (!currentBookKey) return;
      if (selectedChapterNumber) {
        localStorage.setItem(getSelectedChapterStorageKey(currentBookKey), String(selectedChapterNumber));
      } else {
        localStorage.removeItem(getSelectedChapterStorageKey(currentBookKey));
      }
    }

    function restoreSelectedChapter() {
      if (!currentBookKey) {
        selectedChapterNumber = null;
        return;
      }
      const stored = localStorage.getItem(getSelectedChapterStorageKey(currentBookKey));
      selectedChapterNumber = stored ? Number(stored) : null;
    }

    function persistActiveWorkflow() {
      if (!currentBookKey) return;
      if (activeWorkflowId) {
        localStorage.setItem(getActiveWorkflowStorageKey(currentBookKey), activeWorkflowId);
      } else {
        localStorage.removeItem(getActiveWorkflowStorageKey(currentBookKey));
      }
    }

    function restoreActiveWorkflow() {
      if (!currentBookKey) {
        activeWorkflowId = '';
        return;
      }
      activeWorkflowId = localStorage.getItem(getActiveWorkflowStorageKey(currentBookKey)) || '';
    }

    async function refreshAll() {
      await loadBooks();
      await loadCurrentBook();
      await loadWorkflowList();
      await loadChapterList();

      if (selectedChapterNumber) {
        try {
          await openChapter(selectedChapterNumber);
        } catch {
          resetEditor();
        }
      }
    }

    async function loadBooks() {
      const res = await fetch('/api/books');
      const data = await res.json();
      currentBookKey = data.currentBookKey || '';
      restoreSelectedChapter();
      restoreActiveWorkflow();

      const list = document.getElementById('bookList');
      if (!Array.isArray(data.books) || data.books.length === 0) {
        list.innerHTML = '<div class="empty">暂无书籍</div>';
        return;
      }

      list.innerHTML = data.books.map((book) => `
        <div class="book-item ${book.key === currentBookKey ? 'active' : ''}">
          <h3>${escapeHtml(book.title || book.key)}</h3>
          <div class="book-meta">
            <div>类型：${escapeHtml(book.type || '未设置')}</div>
            <div>章节：${book.chapterCount || 0}</div>
            <div>目录：${escapeHtml(book.key)}</div>
          </div>
          <div class="book-actions">
            <button class="select-btn" onclick="selectBook('${escapeAttr(book.key)}')">${book.key === currentBookKey ? '当前书籍' : '切换到这本'}</button>
            <button class="delete-btn" onclick="deleteBook('${escapeAttr(book.key)}')">删除</button>
          </div>
        </div>
      `).join('');
    }

    async function loadCurrentBook() {
      const res = await fetch('/api/novel-info');
      const data = await res.json();

      document.getElementById('novelTitle').value = data.title || '';
      document.getElementById('novelType').value = data.type || '';
      document.getElementById('novelDesc').value = data.description || '';
      document.getElementById('totalChapters').textContent = data.stats?.total || 0;
      document.getElementById('publishedChapters').textContent = data.stats?.published || 0;
      document.getElementById('totalWords').textContent = formatNumber(data.stats?.totalWords || 0);
      document.getElementById('avgWords').textContent = formatNumber(data.stats?.averageWords || 0);
    }

    async function loadWorkflowList() {
      const res = await fetch('/api/workflows');
      const data = await res.json();
      const list = document.getElementById('workflowList');

      if (!data.success || !Array.isArray(data.workflows) || data.workflows.length === 0) {
        list.innerHTML = '<div class="empty">当前书暂无工作流</div>';
        updateTitleWithWorkflow();
        return;
      }

      list.innerHTML = data.workflows.slice(0, 12).map((workflow) => `
        <div class="workflow-item ${workflow.id === activeWorkflowId ? 'active' : ''}">
          <div style="display:flex; justify-content:space-between; gap:12px; align-items:center;">
            <h3>${escapeHtml(workflow.title || workflow.type)}</h3>
            <span class="badge ${escapeAttr(workflow.status)}">${formatWorkflowStatus(workflow.status)}</span>
          </div>
          <div class="workflow-meta">
            <div>任务 ID：${escapeHtml(workflow.id)}</div>
            <div>${escapeHtml(workflow.progress?.message || '')}</div>
            <div>创建时间：${formatDate(workflow.createdAt)}</div>
          </div>
          <div class="progress"><span style="width:${workflow.progress?.percent || 0}%"></span></div>
          <div class="workflow-actions">
            <button class="mini-btn select-btn" onclick="watchWorkflow('${escapeAttr(workflow.id)}')">查看状态</button>
          </div>
        </div>
      `).join('');

      const running = data.workflows.find((workflow) => ['pending', 'running'].includes(workflow.status));
      const active = data.workflows.find((workflow) => workflow.id === activeWorkflowId);
      if (!activeWorkflowId && running) {
        activeWorkflowId = running.id;
        persistActiveWorkflow();
        startWorkflowPolling();
      }

      updateTitleWithWorkflow(active || running || null);
    }

    async function loadChapterList() {
      const res = await fetch('/api/chapters');
      const chapters = await res.json();
      const list = document.getElementById('chapterList');

      if (!Array.isArray(chapters) || chapters.length === 0) {
        list.innerHTML = '<div class="empty">当前书暂无章节</div>';
        resetEditor();
        return;
      }

      list.innerHTML = chapters.map((chapter) => `
        <div class="chapter-item ${chapter.number === selectedChapterNumber ? 'active' : ''}">
          <h3 style="cursor:pointer;" onclick="openChapter(${chapter.number})">第 ${chapter.number} 章 · ${escapeHtml(chapter.title || '未命名章节')}</h3>
          <div class="chapter-meta">${chapter.wordCount || 0} 字 · ${formatDate(chapter.createdAt)} · ${chapter.published ? '已发布' : '待发布'}</div>
          <div class="chapter-actions">
            <button class="mini-btn select-btn" onclick="openChapter(${chapter.number})">查看/编辑</button>
            <button class="mini-btn delete" onclick="deleteChapter(${chapter.number})">删除本章</button>
          </div>
        </div>
      `).reverse().join('');
    }

    async function openChapter(number) {
      const res = await fetch(`/api/chapters/${number}`);
      const data = await res.json();

      if (!data.success) {
        throw new Error(data.error || '读取章节失败');
      }

      selectedChapterNumber = number;
      persistSelectedChapter();
      document.getElementById('editorEmpty').style.display = 'none';
      document.getElementById('editorForm').style.display = 'block';
      document.getElementById('editorTitle').textContent = `第 ${number} 章编辑`;
      document.getElementById('editorMeta').textContent = `${data.chapter.wordCount || 0} 字 · ${formatDate(data.chapter.createdAt)}`;
      document.getElementById('editChapterTitle').value = data.chapter.title || '';
      document.getElementById('editChapterContent').value = data.chapter.content || '';
      clearResult('editorResult');
      await loadChapterList();
    }

    async function reloadSelectedChapter() {
      if (!selectedChapterNumber) return;
      await openChapter(selectedChapterNumber);
    }

    async function saveChapterEdit(event) {
      if (!selectedChapterNumber) {
        showResult('editorResult', '请先选择一章。', false);
        return;
      }

      await runWithButton(event.currentTarget, '保存修改', '保存中...', async () => {
        const title = document.getElementById('editChapterTitle').value.trim();
        const content = document.getElementById('editChapterContent').value;

        const res = await fetch(`/api/chapters/${selectedChapterNumber}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });
        const data = await res.json();

        if (!data.success) {
          throw new Error(data.error || '保存失败');
        }

        showResult('editorResult', `第 ${selectedChapterNumber} 章已保存。`, true);
        document.getElementById('editorMeta').textContent = `${data.chapter.wordCount || 0} 字 · ${formatDate(data.chapter.createdAt)}`;
        await loadChapterList();
      });
    }

    function resetEditor() {
      selectedChapterNumber = null;
      persistSelectedChapter();
      document.getElementById('editorTitle').textContent = '章节编辑器';
      document.getElementById('editorMeta').textContent = '';
      document.getElementById('editorEmpty').style.display = 'block';
      document.getElementById('editorForm').style.display = 'none';
      document.getElementById('editChapterTitle').value = '';
      document.getElementById('editChapterContent').value = '';
      clearResult('editorResult');
    }

    async function createBook() {
      const title = document.getElementById('newBookTitle').value.trim();
      const type = document.getElementById('newBookType').value.trim();
      const description = document.getElementById('newBookDesc').value.trim();

      if (!title && !type && !description) {
        showResult('bookResult', '请至少填写书名、类型或简介中的一项。', false);
        return;
      }

      try {
        const res = await fetch('/api/books', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, type, description })
        });
        const data = await res.json();
        if (!data.success) {
          throw new Error(data.error || '新增书籍失败');
        }

        document.getElementById('newBookTitle').value = '';
        document.getElementById('newBookType').value = '';
        document.getElementById('newBookDesc').value = '';
        showResult('bookResult', `已新增书籍：${data.book.title}`, true);
        resetEditor();
        await refreshAll();
      } catch (error) {
        showResult('bookResult', error.message, false);
      }
    }

    async function selectBook(bookKey) {
      try {
        const res = await fetch('/api/books/select', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bookKey })
        });
        const data = await res.json();
        if (!data.success) {
          throw new Error(data.error || '切换书籍失败');
        }

        stopWorkflowPolling();
        activeWorkflowId = '';
        showResult('bookResult', `已切换到：${bookKey}`, true);
        resetEditor();
        await refreshAll();
        tryRestoreRunningWorkflow();
      } catch (error) {
        showResult('bookResult', error.message, false);
      }
    }

    async function deleteBook(bookKey) {
      if (!confirm(`确认删除书籍 ${bookKey} 吗？这会删除本地文件和数据库记录。`)) {
        return;
      }

      try {
        const res = await fetch(`/api/books/${encodeURIComponent(bookKey)}`, { method: 'DELETE' });
        const data = await res.json();
        if (!data.success) {
          throw new Error(data.error || '删除书籍失败');
        }

        showResult('bookResult', `已删除书籍：${bookKey}`, true);
        stopWorkflowPolling();
        activeWorkflowId = '';
        resetEditor();
        await refreshAll();
      } catch (error) {
        showResult('bookResult', error.message, false);
      }
    }

    async function saveCurrentBook() {
      try {
        const title = document.getElementById('novelTitle').value.trim();
        const type = document.getElementById('novelType').value.trim();
        const description = document.getElementById('novelDesc').value.trim();

        const res = await fetch('/api/create-novel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, type, description })
        });
        const data = await res.json();
        if (!data.success) {
          throw new Error(data.error || '保存失败');
        }

        showResult('currentBookResult', `当前书已保存：${data.title}`, true);
        await refreshAll();
      } catch (error) {
        showResult('currentBookResult', error.message, false);
      }
    }

    async function resetCurrentBook() {
      if (!confirm('确认重置当前书吗？这会清空这本书的全部章节和大纲，但保留书名、类型和简介。')) {
        return;
      }

      try {
        const res = await fetch('/api/reset-book', { method: 'POST' });
        const data = await res.json();
        if (!data.success) {
          throw new Error(data.error || '重置失败');
        }

        showResult('currentBookResult', '当前书已重置。', true);
        resetEditor();
        await refreshAll();
      } catch (error) {
        showResult('currentBookResult', error.message, false);
      }
    }

    async function startGenerationWorkflow(count, event) {
      await requestNotificationPermission();

      await runWithButton(
        event.currentTarget,
        count > 1 ? '启动 10 章工作流' : '启动下一章工作流',
        '创建工作流中...',
        async () => {
          const endpoint = count > 1
            ? '/api/workflows/generate-chapters'
            : '/api/workflows/generate-next-chapter';

          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ count, bookKey: currentBookKey })
          });
          const data = await res.json();

          if (!data.success) {
            throw new Error(data.error || '启动工作流失败');
          }

          activeWorkflowId = data.workflow.id;
          persistActiveWorkflow();
          showResult(
            'workflowResult',
            `工作流已启动：${data.workflow.title}。页面会自动刷新状态，完成后会自动打开新章节。`,
            true
          );
          await loadWorkflowList();
          startWorkflowPolling();
        }
      );
    }

    function watchWorkflow(id) {
      activeWorkflowId = id;
      persistActiveWorkflow();
      startWorkflowPolling();
    }

    function startWorkflowPolling() {
      stopWorkflowPolling();
      if (!activeWorkflowId) return;
      pollActiveWorkflow();
      workflowPollTimer = setInterval(pollActiveWorkflow, 2500);
    }

    function stopWorkflowPolling() {
      if (workflowPollTimer) {
        clearInterval(workflowPollTimer);
        workflowPollTimer = null;
      }
    }

    async function pollActiveWorkflow() {
      if (!activeWorkflowId) return;

      try {
        const res = await fetch(`/api/workflows/${activeWorkflowId}`);
        const data = await res.json();
        if (!data.success) {
          stopWorkflowPolling();
          return;
        }

        const workflow = data.workflow;
        renderWorkflowStatus(workflow);

        if (workflow.status === 'succeeded') {
          stopWorkflowPolling();
          activeWorkflowId = '';
          persistActiveWorkflow();
          await handleWorkflowFinished(workflow, true);
        } else if (workflow.status === 'failed') {
          stopWorkflowPolling();
          activeWorkflowId = '';
          persistActiveWorkflow();
          await handleWorkflowFinished(workflow, false);
        } else {
          await loadWorkflowList();
        }
      } catch (error) {
        showResult('workflowResult', `工作流状态查询失败：${error.message}`, false);
      }
    }

    async function handleWorkflowFinished(workflow, success) {
      if (lastFinishedWorkflowId === workflow.id) {
        return;
      }

      lastFinishedWorkflowId = workflow.id;
      await refreshAll();

      if (success) {
        const latest = workflow.result?.latestChapterNumber;
        showResult(
          'workflowResult',
          workflow.result?.count > 1
            ? `工作流完成，已生成 ${workflow.result.count} 章。`
            : `工作流完成，已生成第 ${latest} 章。`,
          true
        );

        if (latest) {
          selectedChapterNumber = latest;
          persistSelectedChapter();
          await openChapter(latest);
        }

        notifyUser(
          '章节生成完成',
          workflow.result?.count > 1
            ? `已生成 ${workflow.result.count} 章，页面已自动刷新。`
            : `第 ${latest} 章已生成，页面已自动刷新。`
        );
      } else {
        showResult('workflowResult', `工作流失败：${workflow.error || '未知错误'}`, false);
        notifyUser('章节生成失败', workflow.error || '请返回页面查看错误详情。');
      }
    }

    function renderWorkflowStatus(workflow) {
      const percent = workflow.progress?.percent || 0;
      showResult(
        'workflowResult',
        `${formatWorkflowStatus(workflow.status)}：${workflow.progress?.message || ''}（${percent}%）`,
        workflow.status !== 'failed'
      );
      updateTitleWithWorkflow(workflow);
    }

    async function tryRestoreRunningWorkflow() {
      await loadWorkflowList();
      if (activeWorkflowId) {
        startWorkflowPolling();
      }
    }

    async function repairData(event) {
      await runWithButton(event.currentTarget, '修复当前书数据', '修复中...', async () => {
        const res = await fetch('/api/repair-data', { method: 'POST' });
        const data = await res.json();
        if (!data.success) {
          throw new Error(data.error || '修复失败');
        }
        showResult('workflowResult', `已修复 ${data.repaired} 条章节数据。`, true);
        await refreshAll();
      });
    }

    async function publishChapters(event) {
      await runWithButton(event.currentTarget, '发布待发布章节', '发布中...', async () => {
        const res = await fetch('/api/publish', { method: 'POST' });
        const data = await res.json();
        if (!data.success) {
          throw new Error(data.error || '发布失败');
        }
        showResult('publishResult', `发布完成：成功 ${data.count} 章，失败 ${data.failed} 章。`, true);
        await refreshAll();
      });
    }

    async function deleteChapter(number) {
      if (!confirm(`确认删除第 ${number} 章吗？`)) {
        return;
      }

      try {
        const res = await fetch(`/api/chapters/${number}`, { method: 'DELETE' });
        const data = await res.json();
        if (!data.success) {
          throw new Error(data.error || '删除章节失败');
        }

        showResult('workflowResult', `已删除第 ${number} 章。`, true);
        if (selectedChapterNumber === number) {
          resetEditor();
        }
        await refreshAll();
      } catch (error) {
        showResult('workflowResult', error.message, false);
      }
    }

    async function runWithButton(button, idleText, pendingText, handler) {
      button.disabled = true;
      button.innerHTML = `<span class="loading"></span>${pendingText}`;
      try {
        await handler();
      } catch (error) {
        const target = button.id === 'btnPublish' ? 'publishResult' : 'workflowResult';
        showResult(target, error.message, false);
      } finally {
        button.disabled = false;
        button.textContent = idleText;
      }
    }

    async function requestNotificationPermission() {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'default') {
        try {
          await Notification.requestPermission();
        } catch {
          // ignore
        }
      }
    }

    function notifyUser(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body });
      }
    }

    function updateTitleWithWorkflow(workflow = null) {
      if (workflow && ['pending', 'running'].includes(workflow.status)) {
        document.title = `(${workflow.progress?.percent || 0}%) 小说工作台`;
        return;
      }
      document.title = '小说工作台';
    }

    function showResult(id, message, success) {
      const el = document.getElementById(id);
      el.className = `result-box show ${success ? 'success' : 'error'}`;
      el.textContent = message;
    }

    function clearResult(id) {
      const el = document.getElementById(id);
      el.className = 'result-box';
      el.textContent = '';
    }

    function formatWorkflowStatus(status) {
      if (status === 'pending') return '等待中';
      if (status === 'running') return '执行中';
      if (status === 'succeeded') return '已完成';
      if (status === 'failed') return '失败';
      return status || '未知';
    }

    function formatNumber(num) {
      if (num >= 10000) return `${(num / 10000).toFixed(1)}w`;
      if (num >= 1000) return `${(num / 1000).toFixed(1)}k`;
      return String(num);
    }

    function formatDate(value) {
      if (!value) return '';
      return new Date(value).toLocaleString('zh-CN');
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(text) {
      return String(text).replace(/'/g, "\\'");
    }

    async function boot() {
      await refreshAll();
      await tryRestoreRunningWorkflow();
      workflowListPollTimer = setInterval(loadWorkflowList, 8000);
    }

    boot();
  </script>
</body>
</html>
